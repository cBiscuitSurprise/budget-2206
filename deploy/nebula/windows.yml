pki:
  ca: C:\nebula\ca.crt
  cert: C:\nebula\host.crt
  key: C:\nebula\host.key

static_host_map:
  "10.42.0.1": ["s1.h.boyer.consulting:4242"]

lighthouse:
  am_lighthouse: false
  interval: 60
  hosts:
    - "10.42.0.1"

listen:
  host: 0.0.0.0
  port: 0

punchy:
  punch: true

tun:
  dev: boyer-mesh

logging:
  level: info
  format: text

firewall:
  outbound:
    - port: any
      proto: any
      host: any
  inbound:
    - port: any
      proto: icmp
      host: any

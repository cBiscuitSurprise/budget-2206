services:
  actual_server:
    image: docker.io/actualbudget/actual-server:26.11.0
    ports:
      - "127.0.0.1:5006:5006"
    volumes:
      - /opt/actual/data:/data
    healthcheck:
      test: ['CMD-SHELL', 'node scripts/health-check.js']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  caddy:
    image: local/caddy-route53:2.11.7
    network_mode: host
    environment:
      AWS_CONFIG_FILE: /etc/caddy/aws-config
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/aws-config:/etc/caddy/aws-config:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

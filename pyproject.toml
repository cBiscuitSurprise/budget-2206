[project]
name = "budget"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "actualpy==0.22.4",
    "click>=8.1",
    "playwright>=1.64.0",
    "pypdf>=6.21.1",
    "pyyaml>=6.0",
]

[project.scripts]
budget = "budget.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/budget"]

services:
  actual_server:
    image: docker.io/actualbudget/actual-server:26.10.0
    ports:
      - '127.0.0.1:5006:5006'
    volumes:
      - ./.data/actual-budget:/data
    healthcheck:
      test: ['CMD-SHELL', 'node scripts/health-check.js']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

# Personal entity. group -> ordered rules; first match wins; `match` is case-insensitive regex on payee + memo; "?" marks a guess.
Transfers:
  - {category: Reserve line draw (overdraft), kind: transfer, accounts: ["152321820663", "152321820663:creditline"], match: ["OD PROTECTION TRANSFER"]}
  - {category: Reserve line payment, kind: transfer, since: 2026-04-18, match: ["AUTO PAYMENT TO RESERVE LINE"]}
  - {category: Reserve line payment, kind: transfer, accounts: ["152321820663:creditline"], match: ["RESERVE LINE PAYMENT", "PAYMENT TO CREDIT LINE"]}
  - {category: Savings ↔ checking, kind: transfer, match: ["FUNDS TRANSFER-(DEBIT|CREDIT)", "OD PROTECTION TRANSFER", "INTERNET BANKING TRANSFER"]}
  - category: Capital One payment
    kind: transfer
    match: ["WEB AUTHORIZED PMT CAPITAL ONE", "CAPITAL ONE (MOBILE|AUTOPAY|ONLINE) PYMT"]
  - {category: Home Depot card payment, kind: transfer, match: ["^AUTOPAY PAYMENT THANK YOU"]}
  - {category: Home Depot card payment, kind: transfer, since: 2025-10-20, match: ["WEB AUTHORIZED PMT HOME DEPOT"]}
  - {category: Between US Bank accounts, kind: transfer, since: 2026-04-18, match: ["MOBILE BANKING TRANSFER"]}
  - category: Dogwood card payment
    kind: transfer
    since: 2026-04-18
    match: ["ELECTRONIC WITHDRAWAL CARDMEMBER", "ELECTRONIC WITHDRAWAL U\\.S\\. BANK", "MOBILE BANKING PAYMENT TO CREDIT"]
  - category: Dogwood card payment
    kind: transfer
    accounts: ["559257XXXXXX3173"]
    match: ["PAYMENT +THANK YOU", "PAYMENT REVERSAL"]

